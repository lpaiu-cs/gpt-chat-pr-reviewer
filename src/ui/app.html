<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Reviewer</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --line:#272e38;
    --fg:#e6edf3; --dim:#8b949e; --faint:#6e7681;
    --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --err:#f85149;
    --mag:#bc8cff; --cyan:#39c5cf;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#ffffff; --panel:#f6f8fa; --panel2:#eef1f4; --line:#d0d7de;
      --fg:#1f2328; --dim:#59636e; --faint:#818b98;
      --accent:#0969da; --ok:#1a7f37; --warn:#9a6700; --err:#cf222e;
      --mag:#8250df; --cyan:#1b7c83;
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
  }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  code, .mono { font-family:var(--mono); }

  /* ── 헤더 ── */
  header {
    position:sticky; top:0; z-index:10; background:var(--panel);
    border-bottom:1px solid var(--line); padding:.7rem 1rem;
    display:flex; align-items:center; gap:.75rem; flex-wrap:wrap;
  }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--err); flex:none; }
  .dot.live { background:var(--ok); box-shadow:0 0 0 0 rgba(63,185,80,.6); animation:pulse 2.4s infinite; }
  @keyframes pulse { 70%{box-shadow:0 0 0 7px rgba(63,185,80,0)} 100%{box-shadow:0 0 0 0 rgba(63,185,80,0)} }
  h1 { font-size:.95rem; margin:0; font-weight:600; letter-spacing:-.01em; }
  .meta { color:var(--dim); font-size:.78rem; display:flex; gap:.6rem; flex-wrap:wrap; margin-left:auto; }
  .meta b { color:var(--fg); font-weight:500; }

  main { flex:1; padding:1rem; display:flex; flex-direction:column; gap:1rem; max-width:1400px; width:100%; margin:0 auto; }

  /* ── 진행 중 패널 ── */
  #active { border:1px solid var(--accent); border-radius:10px; background:var(--panel);
            padding:1rem; box-shadow:0 0 0 1px rgba(88,166,255,.12) inset; }
  #active.idle { display:none; }
  .act-top { display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap; margin-bottom:.9rem; }
  .act-key { font-family:var(--mono); font-weight:600; font-size:1rem; }
  .act-round { color:var(--accent); font-size:.8rem; font-weight:600; }
  .act-title { color:var(--dim); font-size:.82rem; flex:1; min-width:200px;
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .steps { display:flex; gap:0; align-items:flex-start; margin-bottom:.85rem; overflow-x:auto; }
  .step { flex:1; min-width:74px; text-align:center; position:relative; padding-top:14px; }
  .step::before { content:""; position:absolute; top:4px; left:50%; right:-50%; height:2px; background:var(--line); }
  .step:last-child::before { display:none; }
  .step i { position:absolute; top:0; left:50%; transform:translateX(-50%);
            width:10px; height:10px; border-radius:50%; background:var(--line); }
  .step.done i { background:var(--ok); }
  .step.done::before { background:var(--ok); }
  .step.now i { background:var(--accent); box-shadow:0 0 0 4px rgba(88,166,255,.22); }
  .step span { font-size:.7rem; color:var(--faint); }
  .step.now span { color:var(--accent); font-weight:600; }
  .step.done span { color:var(--dim); }

  .act-live { display:flex; align-items:baseline; gap:.7rem; flex-wrap:wrap;
              background:var(--panel2); border-radius:7px; padding:.6rem .8rem; }
  .elapsed { font-family:var(--mono); font-size:1.6rem; font-weight:600; letter-spacing:-.02em; line-height:1.1; }
  .act-live .lbl { color:var(--dim); font-size:.82rem; }
  .act-live .stream { margin-left:auto; color:var(--dim); font-size:.78rem; font-family:var(--mono); }
  .act-live .stream b { color:var(--fg); font-weight:500; }

  /* ── 카드 그리드 ── */
  .cols { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:1rem; }
  @media (max-width:900px) { .cols { grid-template-columns:1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  section > h2 {
    margin:0; padding:.55rem .85rem; font-size:.78rem; font-weight:600; letter-spacing:.02em;
    color:var(--dim); background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:.45rem;
  }
  section > h2 .n { color:var(--fg); }
  section > h2 .hint { margin-left:auto; font-weight:400; color:var(--faint); font-size:.72rem; }
  .rows { max-height:min(46vh,520px); overflow-y:auto; }
  .empty { padding:1.2rem .85rem; color:var(--faint); font-size:.82rem; text-align:center; }

  .row { padding:.6rem .85rem; border-bottom:1px solid var(--line); display:flex; gap:.6rem; align-items:flex-start; }
  .row:last-child { border-bottom:none; }
  .row .ord { color:var(--faint); font-family:var(--mono); font-size:.78rem; min-width:1.3em; text-align:right; padding-top:1px; }
  .row .body { flex:1; min-width:0; }
  .row .l1 { display:flex; align-items:center; gap:.45rem; flex-wrap:wrap; }
  .row .key { font-family:var(--mono); font-size:.83rem; font-weight:600; }
  .row .l2 { color:var(--dim); font-size:.78rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:.1rem; }
  .row .l3 { color:var(--faint); font-size:.73rem; margin-top:.22rem; display:flex; gap:.55rem; flex-wrap:wrap; align-items:center; }

  .badge { font-size:.68rem; font-weight:600; padding:.1rem .42rem; border-radius:4px;
           border:1px solid currentColor; white-space:nowrap; }
  .b-REVIEW_DUE{color:var(--cyan)} .b-REVIEWING{color:var(--accent)} .b-AWAITING_AUTHOR{color:var(--warn)}
  .b-CONVERGED{color:var(--ok)} .b-QUOTA_BLOCKED{color:var(--mag)} .b-ERROR{color:var(--err)}
  .b-CLOSED{color:var(--faint)}
  .tag { font-size:.68rem; color:var(--accent); background:rgba(88,166,255,.12);
         padding:.1rem .42rem; border-radius:4px; white-space:nowrap; }
  .tag.mute { color:var(--faint); background:var(--panel2); }

  .bar { height:3px; border-radius:2px; background:var(--line); width:70px; overflow:hidden; flex:none; }
  .bar i { display:block; height:100%; background:var(--ok); }
  .err-line { color:var(--err); font-size:.73rem; margin-top:.22rem;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ── 로그 ── */
  #logwrap { max-height:min(38vh,420px); overflow-y:auto; padding:.5rem 0; }
  .log { display:flex; gap:.6rem; padding:.06rem .85rem; font-family:var(--mono); font-size:.755rem; line-height:1.55; }
  .log time { color:var(--faint); flex:none; }
  .log span { white-space:pre-wrap; word-break:break-word; }
  .lv-error span{color:var(--err)} .lv-warn span{color:var(--warn)} .lv-ok span{color:var(--ok)}
  .lv-dim span{color:var(--dim)} .lv-info span{color:var(--fg)}
  .log.restart span { color:var(--warn); }

  /* ── 제어 ── */
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    padding: .2rem .5rem; font-size: .72rem; line-height: 1.4; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn:disabled:hover { border-color: var(--line); color: inherit; }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.warn:hover { border-color: var(--warn); color: var(--warn); }
  .btn.lg { padding: .32rem .7rem; font-size: .78rem; }
  .acts { display: flex; gap: .3rem; flex-wrap: wrap; margin-top: .4rem; }

  /* only 가 걸려 있으면 나머지가 전부 멈추므로 눈에 띄어야 한다 */
  #onlyBar {
    display: none; align-items: center; gap: .6rem; flex-wrap: wrap;
    background: rgba(210,153,34,.12); border: 1px solid var(--warn);
    border-radius: 8px; padding: .5rem .8rem; font-size: .8rem;
  }
  #onlyBar.show { display: flex; }
  #onlyBar b { font-family: var(--mono); }
  #pauseBar {
    display: none; align-items: center; gap: .6rem;
    background: rgba(188,140,255,.12); border: 1px solid var(--mag);
    border-radius: 8px; padding: .5rem .8rem; font-size: .8rem; color: var(--mag);
  }
  #pauseBar.show { display: flex; }

  dialog {
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
    color: var(--fg); padding: 0; max-width: 720px; width: calc(100vw - 2rem);
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  .dlg-h { padding: .7rem .9rem; border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: .6rem; font-weight: 600; font-size: .9rem; }
  .dlg-h .btn { margin-left: auto; }
  .dlg-b { padding: .9rem; display: flex; flex-direction: column; gap: .8rem; }
  .dlg-b label { font-size: .78rem; color: var(--dim); display: block; margin-bottom: .25rem; }
  .dlg-b input, .dlg-b textarea {
    width: 100%; background: var(--bg); color: var(--fg); font-family: var(--mono);
    border: 1px solid var(--line); border-radius: 6px; padding: .45rem .6rem; font-size: .8rem;
  }
  .dlg-b textarea { min-height: 300px; resize: vertical; line-height: 1.55; }
  .dlg-f { display: flex; gap: .5rem; align-items: center; }
  .dlg-f .msg { font-size: .76rem; color: var(--dim); margin-left: auto; }
  .hint-s { font-size: .72rem; color: var(--faint); margin-top: .25rem; }

  /* ── 푸터 ── */
  footer {
    position:sticky; bottom:0; background:var(--panel); border-top:1px solid var(--line);
    padding:.5rem 1rem; font-size:.76rem; color:var(--dim);
    display:flex; gap:1rem; flex-wrap:wrap; align-items:center;
  }
  footer b { color:var(--fg); font-weight:500; font-family:var(--mono); }
  .quota { color:var(--mag); }
  .toggle { margin-left:auto; color:var(--faint); cursor:pointer; user-select:none; font-size:.74rem; }
  .toggle:hover { color:var(--fg); }
</style>
</head>
<body>

<header>
  <span class="dot" id="conn"></span>
  <h1>PR Reviewer</h1>
  <div class="meta">
    <span id="m-scope"></span>
    <span id="m-account"></span>
    <span id="m-uptime"></span>
  </div>
  <button class="btn" id="btn-pause">⏸ 일시정지</button>
  <button class="btn" id="btn-scope">감시 범위</button>
  <button class="btn" id="btn-instr">리뷰 지침</button>
  <button class="btn warn" id="btn-stop" title="watch 프로세스를 종료합니다">■ 종료</button>
</header>

<main>
  <div id="pauseBar">
    <span>⏸ 일시정지 중 — 감시·동기화는 계속하고 리뷰 실행만 멈춰 있습니다. 대기열은 보존됩니다.</span>
  </div>

  <div id="onlyBar">
    <span>⚠ <b id="only-list"></b> <b>만</b> 리뷰합니다 — 나머지는 감시만 하고 큐에 오르지 않습니다.</span>
    <button class="btn warn" id="btn-only-clear">한정 해제</button>
  </div>

  <div id="active" class="idle"></div>

  <div class="cols">
    <section>
      <h2>대기열 <span class="n" id="q-n">0</span><span class="hint">위에서부터 처리</span></h2>
      <div class="rows" id="queue"></div>
    </section>
    <section>
      <h2>추적 중 <span class="n" id="c-n">0</span><span class="hint">최근 변경 순</span></h2>
      <div class="rows" id="contexts"></div>
    </section>
  </div>

  <section>
    <h2>로그 <span class="toggle" id="follow">⏬ 자동 스크롤 켜짐</span></h2>
    <div id="logwrap"></div>
  </section>
</main>

<footer>
  <span id="f-scan">—</span>
  <span>레포 <b id="f-repos">0</b></span>
  <span>열린 PR <b id="f-open">0</b></span>
  <span>사이클 <b id="f-cost">0</b> point</span>
  <span id="f-remain"></span>
  <span id="f-quota" class="quota"></span>
  <span id="f-pending"></span>
</footer>

<dialog id="dlg-scope">
  <form method="dialog" class="dlg-h">감시 범위<button class="btn" value="cancel">닫기</button></form>
  <div class="dlg-b">
    <div>
      <label>include — 감시할 대상 (한 줄에 하나)</label>
      <textarea id="in-include" style="min-height:90px" placeholder="myorg/*&#10;owner/repo"></textarea>
      <div class="hint-s" id="hint-include"></div>
    </div>
    <div>
      <label>exclude — 그중 제외할 글롭</label>
      <textarea id="in-exclude" style="min-height:60px" placeholder="*/archived-*"></textarea>
    </div>
    <div class="dlg-f">
      <button class="btn lg on" id="btn-scope-save">저장</button>
      <span class="msg" id="scope-msg"></span>
    </div>
  </div>
</dialog>

<dialog id="dlg-instr">
  <form method="dialog" class="dlg-h">리뷰 지침 (instructions.md)<button class="btn" value="cancel">닫기</button></form>
  <div class="dlg-b">
    <div>
      <label>매 리뷰 프롬프트의 <code>{{instructions}}</code> 자리에 주입됩니다</label>
      <textarea id="in-instr" spellcheck="false"></textarea>
      <div class="hint-s">HTML 주석(<code>&lt;!-- --&gt;</code>)은 프롬프트에서 제거됩니다. 다음 라운드부터 적용됩니다.</div>
    </div>
    <div class="dlg-f">
      <button class="btn lg on" id="btn-instr-save">저장</button>
      <span class="msg" id="instr-msg"></span>
    </div>
  </div>
</dialog>

<script>
'use strict';

const PHASES = [
  ['conversation', '대화 준비'],
  ['prompt',       '프롬프트 전송'],
  ['waiting',      '응답 대기'],
  ['parsing',      '응답 파싱'],
  ['posting',      '리뷰 게시'],
  ['syncing',      '스레드 동기화'],
];

let snap = null;
let following = true;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/** 경과 시간 — 초 단위까지 보여야 "멈춘 게 아니다" 가 전달된다. */
function dur(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + '초';
  const m = Math.floor(s / 60);
  if (m < 60) return m + '분 ' + (s % 60) + '초';
  const h = Math.floor(m / 60);
  return h + '시간 ' + (m % 60) + '분';
}
function shortDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return s + '초';
  const m = Math.floor(s / 60);
  if (m < 60) return m + '분';
  const h = Math.floor(m / 60);
  if (h < 24) return h + '시간';
  return Math.floor(h / 24) + '일';
}
const clock = (ts) => new Date(ts).toLocaleTimeString('ko-KR', { hour12: false });

// ── 진행 중 패널 ────────────────────────────────────────────

function renderActive() {
  const el = $('active');
  const a = snap && snap.active;
  if (!a) { el.className = 'idle'; el.innerHTML = ''; return; }
  el.className = '';

  const at = PHASES.findIndex((p) => p[0] === a.phase);
  const steps = PHASES.map(([k, label], i) =>
    '<div class="step ' + (i < at ? 'done' : i === at ? 'now' : '') + '">' +
      '<i></i><span>' + label + '</span></div>').join('');

  el.innerHTML =
    '<div class="act-top">' +
      '<a class="act-key" href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.key) + '</a>' +
      '<span class="act-round">' + a.round + '차 리뷰</span>' +
      (a.dryRun ? '<span class="tag mute">dry-run</span>' : '') +
      '<span class="tag">' + esc(a.reasonLabel) + '</span>' +
      '<span class="act-title">' + esc(a.title) + '</span>' +
    '</div>' +
    '<div class="steps">' + steps + '</div>' +
    '<div class="act-live">' +
      '<span class="elapsed" id="a-elapsed">—</span>' +
      '<span class="lbl">' + esc(PHASES[at] ? PHASES[at][1] : a.phase) + '</span>' +
      '<span class="lbl" id="a-total"></span>' +
      '<span class="stream" id="a-stream"></span>' +
    '</div>';
  tick();
}

/** 1초마다 타이머 문자열만 갈아끼운다 — 전체 재렌더는 스크롤을 튀게 한다. */
function tick() {
  const now = Date.now();
  if (snap && snap.active) {
    const a = snap.active;
    const e = $('a-elapsed');
    if (e) e.textContent = dur(now - a.phaseSince);
    const t = $('a-total');
    if (t) t.textContent = '(라운드 전체 ' + dur(now - a.startedAt) + ')';
    const s = $('a-stream');
    if (s) {
      s.innerHTML = a.stream
        ? '<b>' + esc(a.stream.state) + '</b> · ' + a.stream.chars.toLocaleString() + '자 수신'
        : '';
    }
  }
  if (snap) {
    const n = snap.cycle.nextScanAt;
    $('f-scan').textContent = snap.active
      ? '리뷰 진행 중 — 완료 후 즉시 재스캔'
      : snap.cycle.scanning
        ? '스캔 중…'
        : n ? '다음 스캔 ' + dur(n - now) : '—';
    $('m-uptime').innerHTML = '가동 <b>' + shortDur(now - snap.startedAt) + '</b>';
    const q = snap.quotaUntil;
    $('f-quota').textContent = q && q > now
      ? '⏸ 쿼터 대기 ' + dur(q - now) + ' 남음 (대기열 보존)' : '';
  }
  // 대기 시간은 분 단위라 1초마다 다시 그릴 필요가 없다 (10초마다).
  if (now - tick.lastRows > 10_000) { tick.lastRows = now; renderQueue(); }
}
tick.lastRows = 0;

// ── 대기열 · 추적 목록 ──────────────────────────────────────

function renderQueue() {
  if (!snap) return;
  const q = snap.queue;
  $('q-n').textContent = q.length;
  $('queue').innerHTML = q.length === 0
    ? '<div class="empty">대기열이 비어 있습니다.</div>'
    : q.map((e, i) =>
        '<div class="row">' +
          '<span class="ord">' + (i + 1) + '</span>' +
          '<div class="body">' +
            '<div class="l1">' +
              '<a class="key" href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.key) + '</a>' +
              '<span class="tag">' + esc(e.reasonLabel) + '</span>' +
            '</div>' +
            '<div class="l2">' + esc(e.title) + '</div>' +
            '<div class="l3"><span>대기 ' + shortDur(Date.now() - Date.parse(e.waitingSince)) + '</span>' +
              (e.round > 0 ? '<span>' + e.round + '라운드 완료</span>' : '') + '</div>' +
          '</div>' +
        '</div>').join('');
}

/** PR 참조 정규화 — 서버(parsePRRef)와 같은 기준으로 목록 포함 여부를 본다. */
function normRef(s) {
  const m = /^(.+?)#0*(\d+)$/.exec(String(s).trim().toLowerCase());
  return m ? m[1] + '#' + Number(m[2]) : String(s).trim().toLowerCase();
}
const inList = (list, key) => (list || []).some((e) => normRef(e) === normRef(key));

function renderContexts() {
  if (!snap) return;
  const cs = snap.contexts;
  const ctl = snap.control || {};
  $('c-n').textContent = cs.length;
  $('contexts').innerHTML = cs.length === 0
    ? '<div class="empty">추적 중인 PR 이 없습니다. 첫 스캔을 기다리는 중입니다.</div>'
    : cs.map((c) => {
        const pct = c.threadsTotal ? Math.round((c.threadsResolved / c.threadsTotal) * 100) : 0;
        const skipped = inList(ctl.skip, c.key);
        const onlyOn = inList(ctl.only, c.key);
        const pri = inList(ctl.prioritized, c.key);
        const closed = c.state === 'CLOSED';
        return '<div class="row">' +
          '<div class="body">' +
            '<div class="l1">' +
              '<a class="key" href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.key) + '</a>' +
              '<span class="badge b-' + esc(c.state) + '">' + esc(c.stateLabel) + '</span>' +
              (pri ? '<span class="tag">다음 차례</span>' : '') +
              (c.excludedReason ? '<span class="tag mute">제외: ' + esc(c.excludedReason) + '</span>' : '') +
            '</div>' +
            '<div class="l2">' + esc(c.title) + '</div>' +
            '<div class="l3">' +
              '<span>' + c.round + '라운드</span>' +
              '<span>요청 ' + c.requestedCount + '개</span>' +
              (c.threadsTotal
                ? '<span>스레드 ' + c.threadsResolved + '/' + c.threadsTotal + '</span>' +
                  '<span class="bar"><i style="width:' + pct + '%"></i></span>'
                : '') +
              (c.conversationTurns ? '<span>대화 ' + c.conversationTurns + '회</span>' : '') +
              '<span style="color:var(--faint)">' + esc(c.nextAction) + '</span>' +
            '</div>' +
            (c.lastError ? '<div class="err-line">✗ ' + esc(c.lastError) + '</div>' : '') +
            (closed ? '' :
              '<div class="acts" data-key="' + esc(c.key) + '">' +
                // 필터에 걸린 PR 은 스캔이 큐에 올리지 않는다. 누를 수 있게 두면
                // "큐 맨 앞으로" 라고 해놓고 아무 일도 안 일어난다.
                '<button class="btn" data-act="review-now"' +
                  (c.excludedReason
                    ? ' disabled title="' + esc(c.excludedReason) + ' — 먼저 제외를 푸세요"'
                    : '') +
                  '>지금 리뷰</button>' +
                '<button class="btn' + (skipped ? ' on' : '') + '" data-act="skip">' +
                  (skipped ? '제외 해제' : '건너뛰기') + '</button>' +
                '<button class="btn' + (onlyOn ? ' on' : '') + '" data-act="only">' +
                  (onlyOn ? '한정 해제' : '이것만') + '</button>' +
              '</div>') +
          '</div>' +
        '</div>';
      }).join('');
}

// ── 제어 ────────────────────────────────────────────────────

async function sendIntent(body) {
  try {
    const res = await fetch('/api/intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) { alert('요청 실패: ' + (j.error || res.status)); return false; }
    return true;
  } catch (e) {
    alert('요청 실패: ' + e.message);
    return false;
  }
}

// 카드 버튼은 매 렌더마다 새로 만들어지므로 위임으로 받는다.
$('contexts').addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-act]');
  if (!btn) return;
  const key = btn.closest('.acts').dataset.key;
  const ctl = (snap && snap.control) || {};
  const act = btn.dataset.act;

  if (act === 'review-now') sendIntent({ kind: 'review-now', ref: key });
  else if (act === 'skip') {
    sendIntent({ kind: inList(ctl.skip, key) ? 'skip-remove' : 'skip-add', ref: key });
  } else if (act === 'only') {
    // '이것만' 은 목록을 통째로 이 PR 하나로 바꾼다 — 누적이면 무엇이 걸렸는지
    // 추적하기 어렵고, 애초에 하나만 돌려보려고 누르는 버튼이다.
    sendIntent({ kind: 'only-set', refs: inList(ctl.only, key) ? [] : [key] });
  }
});

$('btn-pause').addEventListener('click', () => {
  sendIntent({ kind: (snap && snap.control && snap.control.paused) ? 'resume' : 'pause' });
});
$('btn-only-clear').addEventListener('click', () => sendIntent({ kind: 'only-set', refs: [] }));

// 종료 — /api/intent 가 아니라 전용 엔드포인트다 (intents.ts 의 INTENT_KINDS 참고).
// 여러 세션이 이 데몬 하나를 함께 쓰므로 되묻고, 즉시 끊지 않는다는 것도 알린다.
$('btn-stop').addEventListener('click', async () => {
  const active = snap && snap.active;
  const warn = active
    ? '\n\n지금 ' + active.key + ' ' + active.round + '차 리뷰가 진행 중입니다.\n' +
      '그 라운드를 마친 뒤 종료합니다 (최대 15분).'
    : '';
  if (!confirm('리뷰 데몬을 종료합니다.' + warn + '\n\n계속할까요?')) return;
  try {
    const res = await fetch('/api/shutdown', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}',
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) { alert('종료 요청 실패: ' + (j.error || res.status)); return; }
    $('btn-stop').textContent = '■ 종료 중…';
    $('btn-stop').disabled = true;
  } catch (e) {
    alert('종료 요청 실패: ' + e.message);
  }
});

// ── 감시 범위 편집 ──

const dlgScope = $('dlg-scope');
$('btn-scope').addEventListener('click', () => {
  const ctl = (snap && snap.control) || {};
  $('in-include').value = (ctl.include || []).join('\n');
  $('in-exclude').value = (ctl.exclude || []).join('\n');
  // 모드마다 탐색이 펼칠 수 있는 패턴이 다르다. "글롭 허용" 이라고만 안내하면
  // repos 모드 사용자가 owner/* 를 넣고 아무것도 발견되지 않는 상태에 빠진다
  // (lingering 컨텍스트가 남아 있으면 그 실패가 한동안 가려지기까지 한다).
  $('hint-include').innerHTML =
    ctl.mode === 'repos'
      ? '<b>repos 모드</b>는 글롭을 펼칠 수 없습니다 — <code>owner/repo</code> 를 그대로 적으세요. 글롭이 필요하면 mode 를 account 로 바꾸세요. <b>비울 수 없습니다</b> — 멈추려면 <b>일시정지</b>를 쓰세요.'
      : ctl.mode === 'review-requested'
        ? 'include 는 검색 결과를 거르는 용도입니다. 글롭 제약이 없고 비워도 됩니다.'
        : '글롭을 쓸 수 있지만 <b>소유자 자리</b>는 안 됩니다 (<code>myorg/*</code> ○, <code>*/svc-*</code> ✗) — 검색이 <code>org:&lt;owner&gt;</code> 단위입니다. 슬래시가 없으면 <code>owner/*</code> 로 해석합니다. <b>비울 수 없습니다</b> — 멈추려면 <b>일시정지</b>를 쓰세요.';
  $('scope-msg').textContent = '';
  dlgScope.showModal();
});
const lines = (el) => el.value.split('\n').map((s) => s.trim()).filter(Boolean);
$('btn-scope-save').addEventListener('click', async () => {
  const ok = await sendIntent({
    kind: 'scope-set', include: lines($('in-include')), exclude: lines($('in-exclude')),
  });
  $('scope-msg').textContent = ok ? '저장했습니다 — 다음 스캔부터 적용됩니다.' : '';
});

// ── 지침 편집 ──

const dlgInstr = $('dlg-instr');
$('btn-instr').addEventListener('click', async () => {
  $('instr-msg').textContent = '불러오는 중…';
  dlgInstr.showModal();
  try {
    const j = await (await fetch('/api/instructions')).json();
    $('in-instr').value = j.body || '';
    $('instr-msg').textContent = '';
  } catch (e) {
    $('instr-msg').textContent = '불러오기 실패: ' + e.message;
  }
});
$('btn-instr-save').addEventListener('click', async () => {
  $('instr-msg').textContent = '저장 중…';
  try {
    const res = await fetch('/api/instructions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ body: $('in-instr').value }),
    });
    const j = await res.json().catch(() => ({}));
    $('instr-msg').textContent = res.ok
      ? '저장했습니다 — 다음 라운드부터 적용됩니다.'
      : '저장 실패: ' + (j.error || res.status);
  } catch (e) {
    $('instr-msg').textContent = '저장 실패: ' + e.message;
  }
});

function renderControl() {
  const ctl = (snap && snap.control) || {};
  $('btn-pause').textContent = ctl.paused ? '▶ 재개' : '⏸ 일시정지';
  $('btn-pause').classList.toggle('on', !!ctl.paused);
  $('pauseBar').classList.toggle('show', !!ctl.paused);

  const only = ctl.only || [];
  $('onlyBar').classList.toggle('show', only.length > 0);
  $('only-list').textContent = only.join(', ');

  $('f-pending').textContent = ctl.pendingIntents
    ? '적용 대기 ' + ctl.pendingIntents + '건' + (snap && snap.active ? ' (라운드 종료 후)' : '')
    : '';
}

function renderMeta() {
  if (!snap) return;
  $('m-scope').textContent = snap.scope;
  $('m-account').innerHTML = snap.account
    ? '계정 <b>' + esc(snap.account) + '</b>' + (snap.dryRun ? ' · <b>dry-run</b>' : '') : '';
  $('f-repos').textContent = snap.cycle.watchedRepos;
  $('f-open').textContent = snap.cycle.openCount;
  $('f-cost').textContent = snap.cycle.lastCost;
  $('f-remain').innerHTML = snap.cycle.remaining >= 0
    ? 'GraphQL 잔여 <b>' + snap.cycle.remaining.toLocaleString() + '</b>' : '';
}

function renderAll() {
  renderMeta(); renderControl(); renderActive(); renderQueue(); renderContexts(); tick();
}

// ── 로그 ────────────────────────────────────────────────────

const logwrap = $('logwrap');
let lastSeq = 0;
let session = null;

/**
 * watch 프로세스가 바뀌었는지 확인한다.
 *
 * 단순 재연결(EventSource 의 자동 복구)이면 서버가 링 버퍼를 다시 흘려보내므로
 * seq 로 걸러야 한다. 하지만 watch 를 재시작하면 seq 가 1부터 다시 시작해서,
 * 초기화하지 않으면 새 로그가 전부 "이미 본 것" 으로 버려진다.
 */
function checkSession(id) {
  if (id === session) return;
  if (session !== null) {
    const hr = document.createElement('div');
    hr.className = 'log lv-dim restart';
    hr.innerHTML = '<time>' + clock(Date.now()) + '</time><span>── watch 재시작 ──</span>';
    logwrap.appendChild(hr);
  }
  session = id;
  lastSeq = 0;
}

function addLog(l) {
  if (l.seq <= lastSeq) return; // 같은 세션의 재전송분은 건너뛴다
  lastSeq = l.seq;
  const div = document.createElement('div');
  div.className = 'log lv-' + l.level;
  div.innerHTML = '<time>' + clock(l.at) + '</time><span>' + esc(l.text) + '</span>';
  logwrap.appendChild(div);
  while (logwrap.childElementCount > 600) logwrap.removeChild(logwrap.firstChild);
  if (following) logwrap.scrollTop = logwrap.scrollHeight;
}

logwrap.addEventListener('scroll', () => {
  const atEnd = logwrap.scrollHeight - logwrap.scrollTop - logwrap.clientHeight < 40;
  if (atEnd !== following) { following = atEnd; paintFollow(); }
});
$('follow').addEventListener('click', () => {
  following = !following; paintFollow();
  if (following) logwrap.scrollTop = logwrap.scrollHeight;
});
function paintFollow() {
  $('follow').textContent = following ? '⏬ 자동 스크롤 켜짐' : '⏸ 자동 스크롤 꺼짐';
}

// ── 연결 ────────────────────────────────────────────────────

function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { $('conn').className = 'dot live'; };
  es.onerror = () => { $('conn').className = 'dot'; }; // EventSource 가 알아서 재연결한다
  es.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    // 스냅샷이 로그보다 먼저 온다 (server.ts 의 전송 순서) — 세션 판정이 항상 앞선다.
    if (m.type === 'snapshot') { checkSession(m.data.session); snap = m.data; renderAll(); }
    else if (m.type === 'log') { addLog(m.data); }
  };
}

paintFollow();
connect();
setInterval(tick, 1000);
</script>
</body>
</html>
